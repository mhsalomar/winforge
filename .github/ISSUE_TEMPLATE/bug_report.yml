name: Bug report
description: Report a reproducible WinForge problem
body:
  - type: textarea
    attributes: { label: What happened? }
    validations: { required: true }
  - type: input
    attributes: { label: Windows edition and build }
    validations: { required: true }
  - type: textarea
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    attributes: { label: Sanitized support-bundle details }
