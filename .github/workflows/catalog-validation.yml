name: catalog-validation
on:
  push: { paths: ['catalog/**', 'src/WinForge.Localization/**', 'tests/**'] }
  pull_request: { paths: ['catalog/**', 'src/WinForge.Localization/**', 'tests/**'] }
permissions: { contents: read }
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test tests/WinForge.Infrastructure.Tests/WinForge.Infrastructure.Tests.csproj -c Release --filter Catalog_file_passes_schema
